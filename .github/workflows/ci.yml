name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  # Runners have no display server; Qt widgets built by tests render offscreen.
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Lint, type check, CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check videocaptioner/

      - name: Type check
        run: uv run --frozen pyright videocaptioner/

      - name: Translation sync
        run: uv run --frozen python scripts/sync_translations.py --check

      - name: Unit tests (CLI)
        run: uv run --frozen pytest tests/test_cli/ -q

  offline-tests:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and headless Qt runtime libraries
        # libpulse*: libQt5Multimedia.so.5 inside the PyQt5-Qt5 wheel links against
        # them, so importing PyQt5.QtMultimedia (editor tests) fails at collection
        # without them. gstreamer gives QtMultimedia a playback backend.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libegl1 libglib2.0-0 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libpulse0 libpulse-mainloop-glib0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Install dependencies
        run: uv sync --frozen

      - name: Offline tests
        # integration/slow/llm need external services or API keys and stay manual.
        # The log is kept so the next step can surface failures as annotations,
        # which the public API exposes even when job logs require a login.
        run: |
          set -o pipefail
          uv run --frozen pytest tests/ -q -m "not integration and not slow and not llm" 2>&1 | tee pytest-offline.log

      - name: Annotate failures
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest-offline.log | head -n 10 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          grep -E "^E   |^Interrupted|errors? during collection|passed|failed" pytest-offline.log | head -n 10 | while IFS= read -r line; do
            echo "::warning title=pytest::${line}"
          done
          true
