name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  # Runners have no display server; Qt widgets built by tests render offscreen.
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Lint, type check, CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check videocaptioner/

      - name: Type check (CLI)
        run: uv run --frozen pyright videocaptioner/cli/

      - name: Translation sync
        run: uv run --frozen python scripts/sync_translations.py --check

      - name: Unit tests (CLI)
        run: uv run --frozen pytest tests/test_cli/ -q

  offline-tests:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libegl1 libglib2.0-0 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Offline tests
        # integration/slow/llm need external services or API keys and stay manual.
        run: uv run --frozen pytest tests/ -q -m "not integration and not slow and not llm"
